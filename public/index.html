<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forge | RWA Exchange</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10">
    <nav class="flex justify-between items-center mb-16 border-b border-slate-800 pb-6">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-[#fbbf24] rotate-45"></div>
            <h1 class="text-xl font-bold tracking-widest ml-2">FORGE_ASSETS</h1>
        </div>
        <button id="connect-btn" class="border border-slate-700 px-6 py-2 text-sm hover:bg-slate-800 transition">IDENTITY_LINK</button>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 asset-card p-8">
                <div class="flex justify-between items-start mb-8">
                    <div>
                        <h2 class="text-3xl font-bold">The Obsidian Plaza</h2>
                        <p class="text-slate-400">Premium Commercial Real Estate • London, UK</p>
                    </div>
                    <span class="bg-green-500/10 text-green-500 px-3 py-1 rounded text-xs font-bold uppercase">Verified</span>
                </div>
                
                <div class="grid grid-cols-3 gap-4 mb-8">
                    <div><p class="data-label">Total Valuation</p><p class="text-xl">$12.5M</p></div>
                    <div><p class="data-label">Token Price</p><p class="text-xl">$12.50</p></div>
                    <div><p class="data-label">Yield (APY)</p><p class="text-xl text-[#fbbf24]">6.4%</p></div>
                </div>

                <div class="h-64 bg-slate-900/50 rounded border border-dashed border-slate-700 flex items-center justify-center">
                    <p class="text-slate-600 font-mono text-xs">ASSET_VISUALIZATION_PENDING</p>
                </div>
            </div>

            <div class="asset-card p-8 flex flex-col justify-between">
                <div>
                    <h3 class="text-lg font-bold mb-6">Fractional Purchase</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="data-label">Amount of Shares</label>
                            <input type="number" class="w-full bg-slate-900 border border-slate-700 p-3 mt-2 outline-none focus:border-[#fbbf24]" placeholder="0">
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Total Cost</span>
                            <span>$0.00</span>
                        </div>
                    </div>
                </div>
                <button id="buy-btn" class="gold-btn w-full mt-8">Confirm Acquisition</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <script src="../src/bridge.js"></script>
</body>
</html>
